template: homeassistant-switch
products:
  - brand: Home Assistant
    description: Switch
    group: switch
requirements:
  evcc: ">=0.118"
params:
  - name: uri
    description: URI
    example: http://localhost:8123
  - name: user
    description: User
  - name: password
    description: Password
  - name: entity
    description: Entity
    example: switch.my_switch
  - name: phases
    description: Phases (1-3)
    example: "3"
    advanced: true
render: |
  type: switchsocket
  uri: {{ .uri }}
  user: {{ .user }}
  password: {{ .password }}
  entity: {{ .entity }}
  {{- if .phases }}
  phases: {{ .phases }}
  {{- end }}
